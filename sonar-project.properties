sonar.projectKey=phsb5321_pi
sonar.projectName=pi

# TypeScript monorepo — source roots
sonar.sources=packages,scripts,tools
# Tests are co-located (packages/*/test, scripts/*.test.mjs)
sonar.tests=packages,scripts
sonar.test.inclusions=**/*.test.ts,**/*.test.mjs,**/*.test.js,**/*.spec.ts

# Vendored/generated/fixture surface stays out of the analysis (runbook invariant 6:
# exclusions are for vendored/generated/test-fixture paths ONLY)
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,**/test/fixtures/**,**/examples/**,**/*.min.js
sonar.sourceEncoding=UTF-8

# Community Build is single-branch: analysis runs on main only (see .github/workflows/sonar.yml).
# No sonar.organization (SonarCloud-shaped dead weight on self-hosted).
